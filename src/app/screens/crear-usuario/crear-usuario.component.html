<div class="form-container">
<app-navbar></app-navbar>
<app-sidebar></app-sidebar>
  <!-- Botón de Regresar -->
  <button type="button" class="btn-back" (click)="goBack()" title="Regresar">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-arrow-left-circle-fill" viewBox="0 0 16 16">
      <path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0m3.5 7.5a.5.5 0 0 1 0 1H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5z"/>
    </svg>
    <span>Regresar</span>
  </button>

  <h3 class="form-title">Crear Nuevo Usuario</h3>

  <!-- Mensajes de Feedback -->
  <div *ngIf="mensajeExito" class="alert alert-success mt-3">
    {{ mensajeExito }}
  </div>
  <div *ngIf="mensajeError" class="alert alert-danger mt-3">
    {{ mensajeError }}
  </div>

  <!-- Formulario de Creación de Usuario -->
  <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="mt-4">

    <!-- Campo Email -->
    <div class="mb-3">
      <label for="email" class="form-label">Correo Electrónico</label>
      <input type="email" id="email" formControlName="email" class="form-control"
             [ngClass]="{ 'is-invalid': userForm.get('email')?.invalid && userForm.get('email')?.touched }">
      <div *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched" class="invalid-feedback">
        <div *ngIf="userForm.get('email')?.errors?.['required']">El correo es obligatorio.</div>
        <div *ngIf="userForm.get('email')?.errors?.['email']">Debe ser un correo válido.</div>
      </div>
    </div>

    <!-- Campo Contraseña -->
    <div class="mb-3">
      <label for="password" class="form-label">Contraseña</label>
      <input type="password" id="password" formControlName="password" class="form-control"
             [ngClass]="{ 'is-invalid': userForm.get('password')?.invalid && userForm.get('password')?.touched }">
      <div *ngIf="userForm.get('password')?.invalid && userForm.get('password')?.touched" class="invalid-feedback">
        <div *ngIf="userForm.get('password')?.errors?.['required']">La contraseña es obligatoria.</div>
        <div *ngIf="userForm.get('password')?.errors?.['minlength']">La contraseña debe tener al menos 8 caracteres.</div>
      </div>
    </div>

    <!-- Campo Confirmar Contraseña -->
    <div class="mb-3">
      <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
      <input type="password" id="confirmPassword" formControlName="confirmPassword" class="form-control"
             [ngClass]="{ 'is-invalid': (userForm.get('confirmPassword')?.invalid && userForm.get('confirmPassword')?.touched) || (userForm.errors?.['passwordMismatch'] && userForm.get('confirmPassword')?.touched) }">
      <div *ngIf="(userForm.get('confirmPassword')?.invalid && userForm.get('confirmPassword')?.touched) || (userForm.errors?.['passwordMismatch'] && userForm.get('confirmPassword')?.touched)" class="invalid-feedback">
        <div *ngIf="userForm.get('confirmPassword')?.errors?.['required']">Debes confirmar la contraseña.</div>
        <div *ngIf="userForm.errors?.['passwordMismatch']">Las contraseñas no coinciden.</div>
      </div>
    </div>

    <!-- Campo Rol -->
    <div class="mb-3">
      <label for="role" class="form-label">Rol</label>
      <select id="role" formControlName="role" class="form-select"
              [ngClass]="{ 'is-invalid': userForm.get('role')?.invalid && userForm.get('role')?.touched }">
        <option *ngFor="let roleOption of availableRoles" [value]="roleOption">
          {{ roleOption }}
        </option>
      </select>
      <div *ngIf="userForm.get('role')?.invalid && userForm.get('role')?.touched" class="invalid-feedback">
        Debes seleccionar un rol.
      </div>
    </div>

    <!-- Botón de Envío -->
    <div class="btn-submit-container">
      <button type="submit" class="btn btn-primary" [disabled]="userForm.invalid || isLoading">
        <span *ngIf="!isLoading">Crear Usuario</span>
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
      </button>
    </div>

  </form>
</div>
