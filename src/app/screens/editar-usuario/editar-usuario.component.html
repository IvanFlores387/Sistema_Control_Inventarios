<div class="form-container">
<app-navbar></app-navbar>
<app-sidebar></app-sidebar>
  <!-- Botón de Regresar -->
  <button type="button" class="btn-back" (click)="goBack()" title="Regresar">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-arrow-left-circle-fill" viewBox="0 0 16 16">
      <path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0m3.5 7.5a.5.5 0 0 1 0 1H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5z"/>
    </svg>
    <span>Regresar</span>
  </button>

  <h3 class="form-title">Editar Rol de Usuario</h3>

  <!-- Indicador de Carga -->
  <div *ngIf="isLoading" class="text-center mt-4">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <!-- Mensajes de Feedback -->
  <div *ngIf="mensajeExito" class="alert alert-success mt-3">
    {{ mensajeExito }}
  </div>
  <div *ngIf="mensajeError" class="alert alert-danger mt-3">
    {{ mensajeError }}
  </div>

  <!-- Formulario (se muestra cuando no está cargando y hay un usuario) -->
  <form *ngIf="!isLoading && currentUser" [formGroup]="userForm" (ngSubmit)="onSubmit()" class="mt-4">

    <!-- Mostrar Email (solo lectura) -->
    <div class="mb-3">
      <label class="form-label">Correo Electrónico:</label>
      <input type="text" class="form-control" [value]="currentUser.email" disabled>
    </div>

    <!-- Selector de Rol -->
    <div class="mb-3">
      <label for="role" class="form-label">Rol</label>
      <select id="role" formControlName="role" class="form-select"
              [ngClass]="{ 'is-invalid': userForm.get('role')?.invalid && userForm.get('role')?.touched }">
        <option value="" disabled>Selecciona un rol</option>
        <option *ngFor="let roleOption of availableRoles" [value]="roleOption">
          {{ roleOption }}
        </option>
      </select>
      <div *ngIf="userForm.get('role')?.invalid && userForm.get('role')?.touched" class="invalid-feedback">
        Debes seleccionar un rol.
      </div>
    </div>

    <!-- Botón de Envío -->
    <div class="btn-submit-container">
      <button type="submit" class="btn btn-primary" [disabled]="userForm.invalid">Guardar Cambios</button>
    </div>

  </form>
</div>
