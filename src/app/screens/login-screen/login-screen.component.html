<!-- Usamos la misma clase 'form-container' para heredar el estilo de centrado y el fondo beige -->
<div class="form-container">

  <h3 class="form-title">Iniciar Sesión</h3>
  <p class="form-subtitle">Bienvenido al Gestor de Inventario</p>

  <!-- Mensaje de Error (ej. "Credenciales inválidas") -->
  <div *ngIf="errorMessage" class="alert alert-danger mt-3">
    {{ errorMessage }}
  </div>

  <!-- Formulario de Login -->
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-4">

    <!-- Campo Email -->
    <div class="mb-3">
      <label for="email" class="form-label">Correo Electrónico</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        class="form-control"
        [ngClass]="{ 'is-invalid': loginForm.get('email')?.invalid && loginForm.get('email')?.touched }">

      <!-- Mensajes de error para el email -->
      <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="invalid-feedback">
        <div *ngIf="loginForm.get('email')?.errors?.['required']">El correo es obligatorio.</div>
        <div *ngIf="loginForm.get('email')?.errors?.['email']">Debe ser un correo electrónico válido.</div>
      </div>
    </div>

    <!-- Campo Contraseña -->
    <div class="mb-3">
      <label for="password" class="form-label">Contraseña</label>
      <input
        type="password"
        id="password"
        formControlName="password"
        class="form-control"
        [ngClass]="{ 'is-invalid': loginForm.get('password')?.invalid && loginForm.get('password')?.touched }">

      <!-- Mensajes de error para la contraseña -->
      <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="invalid-feedback">
        <div *ngIf="loginForm.get('password')?.errors?.['required']">La contraseña es obligatoria.</div>
      </div>
    </div>

    <!-- Botón de Envío -->
    <div class="btn-submit-container">
      <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="!isLoading">Ingresar</span>
        <!-- Mostramos un spinner mientras carga -->
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
      </button>
    </div>

    <!-- Opcional: Enlace a la página de registro -->
    <!-- <div class="text-center mt-3">
      <a routerLink="/register">¿No tienes cuenta? Regístrate</a>
    </div> -->
  </form>
</div>
